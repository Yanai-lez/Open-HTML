<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open HTML</title>
<meta name="description" content="Paste HTML code, preview it, save it as a file, and open it as a site. Installable as an app.">
<link rel="canonical" href="https://yanai-lez.github.io/Open-HTML/">

<!-- App / install -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open HTML">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Icons (browser tab, Google results, home screen) -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Link previews (WhatsApp, Telegram, Facebook, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Open HTML">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Open HTML">
<meta property="og:description" content="Paste HTML code, preview it, save it as a file, and open it as a site.">
<meta property="og:url" content="https://yanai-lez.github.io/Open-HTML/">
<meta property="og:image" content="https://yanai-lez.github.io/Open-HTML/icons/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Open HTML">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Open HTML">
<meta name="twitter:description" content="Paste HTML code, preview it, save it as a file, and open it as a site.">
<meta name="twitter:image" content="https://yanai-lez.github.io/Open-HTML/icons/og-image.jpg">

<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --line: #333; --text: #eee;
    --muted: #9db4d6; --blue: #3b82f6; --blue-dark: #2563eb;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    font-family: system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; gap: 10px;
  }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; color: var(--text); }

  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 36px; height: 36px; border-radius: 9px; }
  h1 { margin: 0; font-size: 1.2rem; flex: 1; }

  .btn {
    padding: 10px 12px; font-size: .95rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--line);
  }
  .btn:active { background: #252a35; }
  .primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .primary:active { background: var(--blue-dark); }
  #install {
    display: none; padding: 8px 14px; font-size: .9rem;
    background: transparent; border: 1px solid var(--blue); color: #8ab4ff;
  }

  .toolbar { display: flex; gap: 8px; }
  .toolbar .btn { flex: 1; padding: 9px 6px; font-size: .9rem; }

  .viewbar { display: flex; gap: 8px; }
  .viewbar .btn { padding: 0 16px; }
  .tabs {
    flex: 1; display: flex; gap: 3px; padding: 3px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .tab { flex: 1; padding: 8px; background: transparent; color: var(--muted); font-weight: 600; border-radius: 8px; }
  .tab[aria-selected="true"] { background: var(--blue); color: #fff; }

  .findbar { display: flex; align-items: center; gap: 6px; }
  .findbar select, .findbar input {
    height: 38px; font: inherit; font-size: 16px; /* 16px stops iOS zooming in on focus */
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .findbar select { padding: 0 4px; }
  .findbar input { flex: 1; min-width: 0; padding: 0 10px; }
  .findbar.nomatch input { border-color: #f87171; }
  #find-count { font-size: .8rem; color: var(--muted); white-space: nowrap; text-align: center; min-width: 2.2ch; }
  .findbar .icon { width: 36px; height: 38px; padding: 0; font-size: 1.1rem; }

  /* The editor is three layers in ONE grid cell inside ONE scroller, so they scroll together,
     need no syncing, and always line up:
       .mirror  - draws the Find highlight (its text is transparent)
       .syntax  - a colored copy of the text, built with Prism
       textarea - the real editor, on top; its text is transparent so the colors show through
     The textarea never scrolls by itself: it is as tall as its text and the scroller scrolls.
     Only colors are used on tokens (no bold/italic), so every layer wraps text identically. */
  .stage {
    flex: 1; min-height: 0; position: relative;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .scroller {
    position: absolute; inset: 0; overflow: auto; border-radius: 9px;
    overscroll-behavior: contain; scrollbar-color: #3a4150 transparent;
  }
  .editor { display: grid; min-height: 100%; }
  .editor > * { grid-area: 1 / 1; margin: 0; min-width: 0; }
  textarea, .layer {
    padding: 12px; tab-size: 2;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.45;
    white-space: pre-wrap; overflow-wrap: break-word; letter-spacing: 0;
  }
  .layer { position: relative; pointer-events: none; color: var(--text); }
  .mirror { color: transparent; }
  textarea {
    display: block; width: 100%; height: 100%;
    border: 0; outline: 0; border-radius: 0; resize: none; overflow: hidden;
    background: transparent; color: transparent; caret-color: var(--text);
  }
  textarea::placeholder { color: #6b7686; opacity: 1; }
  textarea::selection { background: rgba(59, 130, 246, .4); color: transparent; }
  /* Very large files get no colors: the textarea then shows its own text. */
  .editor[data-mode="plain"] textarea { color: var(--text); }
  .editor[data-mode="plain"] textarea::selection { color: var(--text); }
  .editor[data-mode="plain"] .syntax { visibility: hidden; }
  .mirror mark {
    color: transparent; border-radius: 3px;
    background: rgba(250, 204, 21, .45); box-shadow: 0 0 0 2px rgba(250, 204, 21, .55);
    transition: background-color .8s, box-shadow .8s;
  }
  .mirror.fade mark { background-color: rgba(250, 204, 21, 0); box-shadow: 0 0 0 2px rgba(250, 204, 21, 0); }
  .stage iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; border-radius: 9px; background: #fff;
  }
  .stage[data-view="preview"] .scroller { display: none; }

  /* Syntax colors (Prism token classes). Colors only, never bold or italic. */
  .syntax .token.comment, .syntax .token.prolog, .syntax .token.doctype, .syntax .token.cdata { color: #7d8ba1; }
  .syntax .token.punctuation, .syntax .token.operator { color: #a3b1c4; }
  .syntax .token.tag, .syntax .token.selector, .syntax .token.deleted { color: #ff8fa3; }
  .syntax .token.attr-name, .syntax .token.class-name, .syntax .token.maybe-class-name { color: #f6c177; }
  .syntax .token.attr-value, .syntax .token.string, .syntax .token.template-string,
  .syntax .token.url, .syntax .token.inserted { color: #9bd68b; }
  .syntax .token.number, .syntax .token.boolean, .syntax .token.constant, .syntax .token.entity,
  .syntax .token.symbol, .syntax .token.unit, .syntax .token.hexcode { color: #f39c6b; }
  .syntax .token.keyword, .syntax .token.atrule, .syntax .token.important { color: #c792ea; }
  .syntax .token.function, .syntax .token.property, .syntax .token.builtin { color: #7cc4ff; }
  .syntax .token.regex { color: #6ee7d1; }
  .syntax .token.attr-value > .token.punctuation { color: #a3b1c4; }
  .syntax .token.interpolation-punctuation { color: #c792ea; }

  .actions { display: flex; gap: 8px; }
  .actions .btn { flex: 1; padding: 14px 8px; font-size: 1rem; }
  .actions .primary { flex: 2; font-size: 1.05rem; }

  .note {
    margin: 0; padding: 10px 12px; font-size: .9rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--muted);
  }

  #toast {
    position: fixed; left: 12px; right: 12px; z-index: 10;
    bottom: calc(84px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; font-size: .95rem;
    background: #252a35; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
  }
  #toast button { background: none; color: #8ab4ff; font-weight: 700; padding: 4px 8px; }

  dialog {
    width: min(92vw, 480px); padding: 0;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 14px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .dlg-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .dlg-head h2 { margin: 0; font-size: 1.1rem; }
  #lib-list { list-style: none; margin: 0; padding: 6px 8px; max-height: 60vh; overflow: auto; }
  #lib-list li { display: flex; align-items: center; gap: 8px; padding: 10px 6px; border-bottom: 1px solid #262a33; }
  #lib-list li:last-child { border-bottom: 0; }
  .lib-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lib-info strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-info small { color: var(--muted); }
  .lib-btn { padding: 8px 12px; font-size: .9rem; }
  #lib-empty { margin: 0; padding: 20px 16px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-96.png" alt="" width="36" height="36">
    <h1>Open HTML</h1>
    <button id="install" type="button">Install app</button>
  </header>

  <p id="ios-hint" class="note" hidden>To install on iPhone: tap the Share button, then "Add to Home Screen".</p>

  <div class="toolbar">
    <button id="paste" class="btn" type="button">Paste</button>
    <button id="open-file" class="btn" type="button">Open file</button>
    <button id="clear" class="btn" type="button">Clear</button>
    <button id="library" class="btn" type="button">Library</button>
  </div>

  <div class="viewbar">
    <div class="tabs" role="tablist">
      <button id="tab-code" class="tab" type="button" role="tab" aria-selected="true">Code</button>
      <button id="tab-preview" class="tab" type="button" role="tab" aria-selected="false">Preview</button>
    </div>
    <button id="find-btn" class="btn" type="button" aria-expanded="false" aria-controls="find-bar">Find</button>
  </div>

  <div id="find-bar" class="findbar" role="search" hidden>
    <select id="find-mode" aria-label="Search type">
      <option value="text">Text</option>
      <option value="line">Line</option>
    </select>
    <input id="find-input" type="search" placeholder="Find in code" enterkeyhint="search"
      autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Search">
    <span id="find-count" aria-live="polite"></span>
    <button id="find-prev" class="btn icon" type="button" aria-label="Previous">&#8593;</button>
    <button id="find-next" class="btn icon" type="button" aria-label="Next">&#8595;</button>
    <button id="find-close" class="btn icon" type="button" aria-label="Close search">&#10005;</button>
  </div>

  <div id="stage" class="stage" data-view="code">
    <div id="scroller" class="scroller">
      <div id="editor" class="editor" data-mode="color">
        <div id="mirror" class="layer mirror" aria-hidden="true" hidden></div>
        <div id="syntax" class="layer syntax" aria-hidden="true"></div>
        <textarea id="code" placeholder="Paste your HTML code here..."
          spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="save" class="btn primary" type="button">Save file</button>
    <button id="open-now" class="btn" type="button">Open now</button>
    <button id="share" class="btn" type="button">Share</button>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <input id="file" type="file" accept=".html,.htm,text/html" hidden>

  <dialog id="lib-dialog">
    <div class="dlg-head">
      <h2>Library</h2>
      <button id="lib-close" class="btn lib-btn" type="button">Close</button>
    </div>
    <p id="lib-empty">Nothing here yet. Every page you save as a file is kept here too.</p>
    <ul id="lib-list"></ul>
  </dialog>

<script src="vendor/prism-bundle.js" data-manual></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var codeBox = $('code');
  var stage = $('stage');
  var DRAFT_KEY = 'open-html-draft';
  var LIB_KEY = 'open-html-library';
  var EMPTY_PREVIEW = '<body style="margin:0;height:100vh;display:grid;place-items:center;' +
    'font-family:system-ui,sans-serif;color:#777">Nothing to preview yet</body>';
  var currentName = 'my-site';

  // ---------- Storage (guarded: it can be blocked or full) ----------
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function store(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  // ---------- Toast (with optional action, e.g. Undo) ----------
  var toastEl = $('toast');
  var toastTimer;
  function hideToast() { toastEl.hidden = true; }
  function toast(message, actionLabel, action) {
    clearTimeout(toastTimer);
    toastEl.textContent = '';
    var span = document.createElement('span');
    span.textContent = message;
    toastEl.appendChild(span);
    if (actionLabel) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = actionLabel;
      b.addEventListener('click', function () { hideToast(); action(); });
      toastEl.appendChild(b);
    }
    toastEl.hidden = false;
    toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 3500);
  }

  // ---------- Draft: autosave and restore ----------
  var draftTimer;
  function saveDraft() { store(DRAFT_KEY, { code: codeBox.value, name: currentName }); }
  codeBox.addEventListener('input', function () {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 400);
  });
  window.addEventListener('pagehide', saveDraft);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveDraft(); });

  var draft = load(DRAFT_KEY, null);
  if (draft && typeof draft.code === 'string') {
    codeBox.value = draft.code;
    if (draft.name) currentName = draft.name;
  }

  // Replace the text box content, with an Undo for the previous content.
  function setCode(text, name, message) {
    var previous = codeBox.value;
    var previousName = currentName;
    codeBox.value = text;
    if (name) currentName = name;
    refreshColors();
    clearHighlight();
    saveDraft();
    showView('code');
    if (previous.trim() && previous !== text) {
      toast(message, 'Undo', function () {
        codeBox.value = previous;
        currentName = previousName;
        refreshColors();
        clearHighlight();
        saveDraft();
      });
    } else {
      toast(message);
    }
  }

  // ---------- Code / Preview tabs ----------
  function showView(view) {
    stage.dataset.view = view;
    $('tab-code').setAttribute('aria-selected', String(view === 'code'));
    $('tab-preview').setAttribute('aria-selected', String(view === 'preview'));
    if (view !== 'code') clearHighlight();

    // A fresh frame every time: it stops any scripts from the previous preview,
    // and avoids a Chrome quirk where a reused frame can render at zero size.
    var old = stage.querySelector('iframe');
    if (old) old.remove();
    if (view === 'preview') {
      var f = document.createElement('iframe');
      f.id = 'preview';
      f.title = 'Preview';
      // No allow-same-origin: the preview cannot touch this app's storage.
      f.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups allow-downloads');
      f.srcdoc = codeBox.value.trim() ? codeBox.value : EMPTY_PREVIEW;
      stage.appendChild(f);
    }
  }
  $('tab-code').addEventListener('click', function () { showView('code'); });
  $('tab-preview').addEventListener('click', function () { showView('preview'); });

  // ---------- Files ----------
  function stripExt(name) { return name.replace(/\.html?$/i, ''); }

  function cleanName(name) {
    name = (name || '').trim().replace(/[\\/:*?"<>|]/g, '-');
    if (!name) name = 'my-site';
    if (!/\.html?$/i.test(name)) name += '.html';
    return name;
  }

  function download(name, code) {
    var blob = new Blob([code], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function requireCode() {
    if (codeBox.value.trim()) return true;
    toast('The text box is empty.');
    return false;
  }

  // ---------- Library ----------
  function getLibrary() {
    var lib = load(LIB_KEY, []);
    return Array.isArray(lib) ? lib : [];
  }

  function addToLibrary(name, code) {
    var lib = getLibrary();
    var key = name.toLowerCase();
    var now = Date.now();
    var found = false;
    lib.forEach(function (item) {
      if (item.name.toLowerCase() === key) { item.code = code; item.updated = now; found = true; }
    });
    if (!found) {
      lib.push({ id: now + '-' + Math.random().toString(36).slice(2, 6), name: name, code: code, updated: now });
    }
    return store(LIB_KEY, lib);
  }

  function libButton(label, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn lib-btn';
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  var libDialog = $('lib-dialog');
  function renderLibrary() {
    var list = $('lib-list');
    var lib = getLibrary().sort(function (a, b) { return b.updated - a.updated; });
    list.textContent = '';
    $('lib-empty').hidden = lib.length > 0;
    lib.forEach(function (item) {
      var li = document.createElement('li');
      var info = document.createElement('div');
      info.className = 'lib-info';
      var title = document.createElement('strong');
      title.textContent = item.name;
      var when = document.createElement('small');
      when.textContent = new Date(item.updated).toLocaleString();
      info.appendChild(title);
      info.appendChild(when);
      li.appendChild(info);
      li.appendChild(libButton('Open', function () {
        libDialog.close();
        setCode(item.code, stripExt(item.name), 'Opened "' + item.name + '".');
      }));
      li.appendChild(libButton('Delete', function () {
        if (!confirm('Delete "' + item.name + '" from the library?')) return;
        store(LIB_KEY, getLibrary().filter(function (x) { return x.id !== item.id; }));
        renderLibrary();
      }));
      list.appendChild(li);
    });
  }
  $('library').addEventListener('click', function () { renderLibrary(); libDialog.showModal(); });
  $('lib-close').addEventListener('click', function () { libDialog.close(); });
  libDialog.addEventListener('click', function (e) { if (e.target === libDialog) libDialog.close(); });

  // ---------- Save file (also kept in the library) ----------
  $('save').addEventListener('click', function () {
    if (!requireCode()) return;
    var asked = prompt('What should the file be called?', currentName);
    if (asked === null) return;
    var name = cleanName(asked);
    currentName = stripExt(name);
    download(name, codeBox.value);
    var kept = addToLibrary(name, codeBox.value);
    saveDraft();
    toast(kept ? 'Saved "' + name + '" and added it to your library.'
               : 'Saved "' + name + '". (Library storage is unavailable.)');
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      $('save').click();
    }
  });

  // ---------- Open now (in a new tab, without downloading) ----------
  $('open-now').addEventListener('click', function () {
    if (!requireCode()) return;
    var url = URL.createObjectURL(new Blob([codeBox.value], { type: 'text/html;charset=utf-8' }));
    var w = window.open(url, '_blank');
    if (!w) toast('Your browser blocked the new tab. Allow pop-ups for this site.');
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  });

  // ---------- Share the file (WhatsApp, etc.) ----------
  var shareBtn = $('share');
  if (!navigator.share) shareBtn.hidden = true;
  shareBtn.addEventListener('click', function () {
    if (!requireCode()) return;
    var name = cleanName(currentName);
    var file = new File([codeBox.value], name, { type: 'text/html' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function (e) {
        if (e && e.name !== 'AbortError') toast('Sharing failed.');
      });
    } else {
      download(name, codeBox.value);
      toast('This device cannot share files, so "' + name + '" was downloaded instead.');
    }
  });

  // ---------- Paste, Clear, Open file ----------
  function pasteFallback() {
    showView('code');
    codeBox.focus();
    toast('Long-press in the box and choose Paste.');
  }
  $('paste').addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { pasteFallback(); return; }
    navigator.clipboard.readText().then(function (text) {
      if (!text.trim()) { toast('The clipboard is empty.'); return; }
      setCode(text, null, 'Pasted from the clipboard.');
    }).catch(pasteFallback);
  });

  $('clear').addEventListener('click', function () {
    if (!codeBox.value) return;
    setCode('', null, 'Cleared.');
  });

  function loadFile(file) {
    return file.text().then(function (text) {
      setCode(text, stripExt(file.name), 'Opened "' + file.name + '".');
    }).catch(function () { toast('Could not read that file.'); });
  }
  var fileInput = $('file');
  $('open-file').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var file = fileInput.files[0];
    fileInput.value = '';
    if (file) loadFile(file);
  });

  // Desktop installed app: double-click an .html file to open it here.
  if ('launchQueue' in window && window.launchQueue.setConsumer) {
    window.launchQueue.setConsumer(function (params) {
      if (params.files && params.files.length) params.files[0].getFile().then(loadFile);
    });
  }

  // ---------- Receive HTML shared from another app ----------
  // The service worker stores the shared content and redirects here with ?share=1.
  if (/[?&]share=1/.test(location.search) && 'caches' in window) {
    caches.open('open-html-share').then(function (cache) {
      return cache.match('shared').then(function (res) {
        if (!res) return;
        return res.json().then(function (data) {
          if (data.text) {
            setCode(data.text, data.name ? stripExt(data.name) : null,
              data.name ? 'Loaded "' + data.name + '". Review it, then tap Save file.'
                        : 'Loaded the shared content. Review it, then tap Save file.');
          }
          return cache.delete('shared');
        });
      });
    }).catch(function () {});
    history.replaceState(null, '', location.pathname);
  }

  // ---------- Install as an app ----------
  var installBtn = $('install');
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () {
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  });
  window.addEventListener('appinstalled', function () { installBtn.style.display = 'none'; });

  // iPhone/iPad Safari has no install prompt, so show a short hint instead.
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  if (isIOS && !isStandalone) $('ios-hint').hidden = false;

  // ---------- Find: a text (letters, words) or a line number ----------
  // Jumps to the match and highlights it for a few seconds. The highlight is drawn
  // in the "mirror" behind the textarea, which lays out the same text identically.
  var findBar = $('find-bar');
  var findBtn = $('find-btn');
  var findInput = $('find-input');
  var findMode = $('find-mode');
  var findCount = $('find-count');
  var mirror = $('mirror');
  var scroller = $('scroller');
  var HIGHLIGHT_MS = 3000;   // total time; the last 0.8s is a fade (see CSS)
  var MAX_MATCHES = 10000;
  var hlFadeTimer, hlHideTimer;
  var lastPos = 0;           // where the current match starts

  function clearHighlight() {
    clearTimeout(hlFadeTimer);
    clearTimeout(hlHideTimer);
    mirror.hidden = true;
    mirror.textContent = '';
    mirror.classList.remove('fade');
  }

  function highlight(start, end) {
    if (stage.dataset.view !== 'code') showView('code');
    clearHighlight();
    var text = codeBox.value;
    var mark = document.createElement('mark');
    mark.textContent = text.slice(start, end) || ' '; // an empty line still gets a visible block
    mirror.append(
      document.createTextNode(text.slice(0, start)),
      mark,
      document.createTextNode(text.slice(end) + '​')  // keeps a trailing empty line the same height
    );
    mirror.hidden = false;
    // Scroll so the match sits in the upper part of the box, clear of a phone keyboard.
    scroller.scrollTop = Math.max(0, mark.offsetTop - scroller.clientHeight * 0.25);
    hlFadeTimer = setTimeout(function () { mirror.classList.add('fade'); }, HIGHLIGHT_MS - 800);
    hlHideTimer = setTimeout(clearHighlight, HIGHLIGHT_MS);
  }

  codeBox.addEventListener('input', clearHighlight); // the text changed, so the highlight is stale

  function setCount(message, bad) {
    findCount.textContent = message;
    findBar.classList.toggle('nomatch', !!bad);
  }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function findAll(query) {
    var re = new RegExp(escapeRegExp(query), 'gi'); // letters, case-insensitive; symbols match literally
    var text = codeBox.value, hits = [], m;
    while ((m = re.exec(text)) && hits.length < MAX_MATCHES) {
      hits.push({ start: m.index, end: m.index + m[0].length });
    }
    return hits;
  }

  // dir: 'first' (the query just changed), 'next' or 'prev'. Both wrap around.
  function findText(dir) {
    var query = findInput.value;
    if (!query) { clearHighlight(); setCount(''); return; }
    var hits = findAll(query);
    if (!hits.length) { clearHighlight(); setCount('0', true); return; }
    var i = 0, k;
    if (dir === 'prev') {
      i = hits.length - 1;
      for (k = hits.length - 1; k >= 0; k--) { if (hits[k].start < lastPos) { i = k; break; } }
    } else {
      var from = dir === 'next' ? lastPos + 1 : lastPos;
      for (k = 0; k < hits.length; k++) { if (hits[k].start >= from) { i = k; break; } }
    }
    lastPos = hits[i].start;
    setCount((i + 1) + '/' + hits.length + (hits.length >= MAX_MATCHES ? '+' : ''));
    highlight(hits[i].start, hits[i].end);
  }

  function findLine(dir) {
    var raw = findInput.value.trim();
    if (!raw) { clearHighlight(); setCount(''); return; }
    var lines = codeBox.value.split('\n');
    var total = lines.length;
    var n = parseInt(raw, 10);
    if (dir === 'next') n = (n || 0) + 1;
    if (dir === 'prev') n = (n || total + 1) - 1;
    if (dir !== 'first') {
      if (n > total) n = 1;
      if (n < 1) n = total;
      findInput.value = String(n);
    }
    if (!(n >= 1)) { clearHighlight(); setCount('From 1', true); return; }
    if (n > total) { clearHighlight(); setCount('Only ' + total, true); return; }
    var start = 0;
    for (var i = 0; i < n - 1; i++) start += lines[i].length + 1;
    setCount(n + '/' + total);
    highlight(start, start + lines[n - 1].length);
  }

  function runFind(dir) { (findMode.value === 'line' ? findLine : findText)(dir); }

  function applyFindMode() {
    var line = findMode.value === 'line';
    findInput.placeholder = line ? 'Line number' : 'Find in code';
    findInput.setAttribute('inputmode', line ? 'numeric' : 'search');
    findInput.setAttribute('enterkeyhint', line ? 'go' : 'search');
  }

  function openFind() {
    findBar.hidden = false;
    findBtn.setAttribute('aria-expanded', 'true');
    findBtn.classList.add('primary');
    applyFindMode();
    lastPos = 0;
    findInput.focus();
    findInput.select();
    if (findInput.value) runFind('first');
  }

  function closeFind() {
    findBar.hidden = true;
    findBtn.setAttribute('aria-expanded', 'false');
    findBtn.classList.remove('primary');
    clearHighlight();
    setCount('');
  }

  findBtn.addEventListener('click', function () { if (findBar.hidden) openFind(); else closeFind(); });
  $('find-close').addEventListener('click', closeFind);
  $('find-next').addEventListener('click', function () { runFind('next'); });
  $('find-prev').addEventListener('click', function () { runFind('prev'); });
  // Tapping these must not take focus from the box, or the phone keyboard keeps closing.
  ['find-next', 'find-prev', 'find-close'].forEach(function (id) {
    $(id).addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  findInput.addEventListener('input', function () {
    if (findMode.value === 'line') {
      var digits = findInput.value.replace(/\D/g, '');
      if (digits !== findInput.value) findInput.value = digits;
    }
    if (!findInput.value) lastPos = 0;
    runFind('first');
  });
  findInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); closeFind(); return; } // keep the query (browsers clear it on Esc)
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (findMode.value === 'line') runFind('first'); // already on that line: flash it again
    else runFind(e.shiftKey ? 'prev' : 'next');
  });
  findMode.addEventListener('change', function () {
    findInput.value = '';
    lastPos = 0;
    clearHighlight();
    setCount('');
    applyFindMode();
    findInput.focus();
  });

  // ---------- Syntax colors ----------
  // The text is copied into the .syntax layer behind the (transparent) textarea and colored
  // by Prism. Small files are re-colored on every keystroke. If that is too slow on this
  // device, plain text shows while you type and the colors return when you pause. Very
  // large files (or no Prism) stay plain.
  var syntax = $('syntax');
  var editor = $('editor');
  var LAZY_MAX = 200000;   // more characters than this: no colors
  var FAST_MS = 12;        // coloring slower than this waits for a pause in typing
  var lazyTimer;
  var lastCost = 0;        // how long the last coloring took, in ms

  function paintPlain(text) {
    syntax.textContent = text + '​'; // the zero-width space keeps a trailing empty line the same height
    editor.dataset.mode = 'plain';
  }

  function paintColors() {
    var text = codeBox.value;
    var started = performance.now();
    try {
      syntax.innerHTML = Prism.highlight(text, Prism.languages.markup, 'markup') + '​';
      editor.dataset.mode = 'color';
    } catch (e) {
      paintPlain(text);
    }
    lastCost = performance.now() - started;
  }

  function refreshColors() {
    clearTimeout(lazyTimer);
    var text = codeBox.value;
    if (typeof Prism === 'undefined' || text.length > LAZY_MAX) { paintPlain(text); return; }
    if (lastCost <= FAST_MS) { paintColors(); return; }
    paintPlain(text);
    lazyTimer = setTimeout(paintColors, 200);
  }
  codeBox.addEventListener('input', refreshColors);
  refreshColors(); // colors for a restored draft

  // ---------- Offline support + share target ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
