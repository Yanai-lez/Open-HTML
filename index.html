<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    font-family: system-ui, sans-serif;
    background: #0f1115; color: #eee;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; gap: 12px;
  }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { margin: 0; font-size: 1.3rem; flex: 1; }
  textarea {
    flex: 1; width: 100%; padding: 12px;
    background: #1a1d24; color: #eee;
    border: 1px solid #333; border-radius: 10px;
    font-family: monospace; font-size: 14px;
    direction: ltr; text-align: left; resize: none;
  }
  button {
    padding: 14px; font-size: 1.1rem; font-weight: 600;
    border: 0; border-radius: 10px;
    background: #3b82f6; color: #fff; cursor: pointer;
  }
  button:active { background: #2563eb; }
  #install {
    display: none; padding: 8px 14px; font-size: .95rem;
    background: transparent; border: 1px solid #3b82f6; color: #8ab4ff;
  }
  #ios-hint {
    display: none; margin: 0; padding: 10px 12px; font-size: .9rem;
    background: #1a1d24; border: 1px solid #333; border-radius: 10px; color: #9db4d6;
  }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-96.png" alt="" width="40" height="40">
    <h1>Open HTML</h1>
    <button id="install" type="button">התקן אפליקציה</button>
  </header>
  <p id="ios-hint">להתקנה באייפון: לחץ על כפתור השיתוף ואז "הוסף למסך הבית".</p>
  <textarea id="code" placeholder="הדבק כאן את קוד ה-HTML..." spellcheck="false"></textarea>
  <button id="save" type="button">שמור קובץ</button>

<script>
  // ---- Save as a file ----
  document.getElementById('save').addEventListener('click', function () {
    var code = document.getElementById('code').value;
    if (!code.trim()) {
      alert('תיבת הטקסט ריקה');
      return;
    }

    var name = prompt('איך לקרוא לקובץ?', 'my-site');
    if (name === null) return;

    name = name.trim().replace(/[\\/:*?"<>|]/g, '-');
    if (!name) name = 'my-site';
    if (!/\.html?$/i.test(name)) name += '.html';

    var blob = new Blob([code], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  // ---- Install as an app ----
  var installBtn = document.getElementById('install');
  var deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });

  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () {
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  });

  window.addEventListener('appinstalled', function () {
    installBtn.style.display = 'none';
  });

  // iPhone/iPad Safari has no install prompt, so show a short hint instead.
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  if (isIOS && !isStandalone) {
    document.getElementById('ios-hint').style.display = 'block';
  }

  // ---- Offline support ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
